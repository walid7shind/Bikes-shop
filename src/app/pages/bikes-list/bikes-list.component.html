<h2>Bikes</h2>

<div *ngIf="loading">Loading...</div>
<p>Bikes count : {{ bikes.length }}</p>
<div *ngIf="errorMessage && !loading" class="error">
  <p>{{ errorMessage }}</p>
  <button (click)="retry()">Retry</button>
</div>

<div *ngFor="let b of bikes">
  <app-bike-card
    [bike]="b"
    [finalPrice]="finalPrice(b)"
    (addToCart)="onAddToCart($event)"
    (openDetails)="onOpenDetails($event)">
  </app-bike-card>
</div>
